title: Eyes of Wakanda
desc: Eyes of Wakanda — character design and visual development by Uzoma Dunkwu for Marvel Animation.
slides:
- src: assets/eow/eow-01-lineup.png
  alt: Five Lion team warriors in gold lion masks and layered violet wraps, standing in a row.
  caption: Lion team lineup
- src: assets/eow/eow-02-noni.png
  alt: 'Noni: a portrait bust, a fighting stance in a blue wrap, and three grey action studies.'
  caption: Noni
- src: assets/eow/eow-03-noni-keys.png
  alt: 'Five costume passes on Noni: teal wrap, hooded cloak, mask and collar, pale robe, layered skirt.'
  caption: Noni
- src: assets/eow/eow-04-old-noni.png
  alt: An older Noni in an ochre cloak and violet skirt, with four white construction turnarounds.
  caption: Old Noni
- src: assets/eow/eow-05-traveller.png
  alt: Five travelling-costume variants built on grey mannequins with fur collars, beads and wraps.
  caption: Noni traveller
- src: assets/eow/eow-06-councilman.png
  alt: 'A high councilman: base bodysuit, a mask study, three olive and violet draping variants.'
  caption: High councilman
- src: assets/eow/eow-07-kuda.png
  alt: Kuda, a broad man in a red and blue panelled tunic, drawn twice, with a slimmer youth in violet.
  caption: Kuda
- src: assets/eow/eow-08-tafari.png
  alt: Tafari in violet armour with a metal vambrace, standing with a younger figure.
  caption: Tafari and Kuda
- src: assets/eow/eow-09-lion-guard.png
  alt: Six lion guard head studies with different hairlines, scars and headbands.
  caption: Lion guard faces
- src: assets/eow/eow-10-chainmakers.png
  alt: Five armoured chain makers in helmets and studded leather, front and back.
  caption: Lion chain makers
- src: assets/eow/eow-11-harem.png
  alt: Four figures in pale blue robes and gold headdresses.
  caption: Harem captives
- src: assets/eow/eow-12-seamstresses.png
  alt: Three seamstresses in teal and gold wraps, of different ages and builds.
  caption: Seamstresses
- src: assets/eow/eow-13-ethiopian.png
  alt: A shield bearer, a spearman in a grey robe, and a commander with a gold disc shield.
  caption: Ethiopian soldiers
- src: assets/eow/eow-14-crowd.png
  alt: Four river tribe civilians in striped and beaded wraps, one in a wide woven hat.
  caption: Wakandan crowd, river tribe
- src: assets/eow/eow-15-dora.png
  alt: Five torsos labelled Shakoo, B'Risa, Koi'Fay, Y'Fett and Le'illa, each with a geometric primitive and handwritten design notes.
  caption: Style exploration, Dora
- src: assets/eow/eow-16-flashback.png
  alt: A rendered bald warrior bust in warm light, with the line drawing it came from.
  caption: Style exploration, flashback
- src: assets/eow/eow-17-dora-02.png
  alt: Four vignettes of the Lion team together, annotated in red handwriting.
  caption: Style exploration, Dora
- src: assets/eow/eow-18-crowd-02.png
  alt: Four mining tribe figures in red checked cloth, beads and heavy sandals.
  caption: Wakandan crowd, mining tribe
- src: assets/eow/eow-19-crowd-03.png
  alt: Four merchants in deep blue and plum robes, one veiled.
  caption: Wakandan crowd, merchant tribe
